[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "RLMResearchPlanner"
version = "0.0.11"
description = "Unofficial multilingual research planner for Lords Mobile"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pyinstaller>=6,<7",
]

[project.scripts]
rlm-research-planner = "rlm_research_planner.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rlm_research_planner"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["src"]
