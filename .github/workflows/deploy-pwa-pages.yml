name: Deploy PWA to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - pwa-preview
    paths:
      - "tools/RLMResearchPlannerPWA/**"
      - ".github/workflows/deploy-pwa-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Require the validated preview commit for production
        if: github.ref_name == 'main'
        shell: bash
        run: |
          git fetch origin pwa-preview --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"

      - name: Check out production for preview deployment
        if: github.ref_name == 'pwa-preview'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: _production

      - name: Prepare production and preview paths
        shell: bash
        run: |
          mkdir -p _site/preview
          if [[ "${GITHUB_REF_NAME}" == "pwa-preview" ]]; then
            cp -a _production/tools/RLMResearchPlannerPWA/. _site/
          else
            cp -a tools/RLMResearchPlannerPWA/. _site/
          fi
          cp -a tools/RLMResearchPlannerPWA/. _site/preview/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload PWA
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
