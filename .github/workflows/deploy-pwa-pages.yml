name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "tools/RLMResearchPlannerPWA/**"
      - "scripts/check_pwa_release.mjs"
      - ".github/workflows/deploy-pwa-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify PWA release
        shell: bash
        run: |
          node --check tools/RLMResearchPlannerPWA/src/app.js
          node --check tools/RLMResearchPlannerPWA/src/catalog.js
          node --check tools/RLMResearchPlannerPWA/src/planning.js
          node --check tools/RLMResearchPlannerPWA/src/castle-planning.js
          node --check tools/RLMResearchPlannerPWA/src/state.js
          node --check tools/RLMResearchPlannerPWA/src/language-pack.js
          node --check tools/RLMResearchPlannerPWA/src/paid-value.js
          node --check tools/RLMResearchPlannerPWA/sw.js
          node scripts/check_pwa_release.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload PWA
        uses: actions/upload-pages-artifact@v3
        with:
          path: tools/RLMResearchPlannerPWA
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
