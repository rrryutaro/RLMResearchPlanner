name: Validate release source

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - pwa-preview

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install dataset validator
        run: python -B -m pip install "jsonschema>=4,<5"

      - name: Check immutable release provenance
        run: python -B .github/scripts/validate_release_provenance.py

      - name: Check distributable research dataset
        run: python -B dataset/scripts/check_distribution.py dataset/generated

      - name: Reject stale PWA data
        working-directory: tools/RLMResearchPlannerPWA
        run: |
          node scripts/sync-catalog.mjs
          git diff --exit-code -- data

      - name: Test public PWA layout
        working-directory: tools/RLMResearchPlannerPWA
        run: |
          node --test tests/*.test.mjs
          node scripts/check-release.mjs
