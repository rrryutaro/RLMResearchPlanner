name: Validate release source

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - pwa-preview

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install desktop dependencies
        shell: pwsh
        run: python -B -m pip install -e ".[dev]"

      - name: Check distributable research dataset
        shell: pwsh
        run: python -B dataset/scripts/check_distribution.py dataset/generated

      - name: Synchronize bundled language packs
        shell: pwsh
        run: python -B scripts/sync_bundled_language_packs.py

      - name: Check multilingual coverage
        shell: pwsh
        run: python -B scripts/check_language_coverage.py

      - name: Synchronize PWA data
        shell: pwsh
        working-directory: tools/RLMResearchPlannerPWA
        run: node scripts/sync-catalog.mjs

      - name: Reject stale generated data
        shell: pwsh
        run: git diff --exit-code -- dataset tools/RLMResearchPlannerPWA/data

      - name: Test desktop application
        shell: pwsh
        run: python -B -m pytest -q -p no:cacheprovider tests

      - name: Check release licenses
        shell: pwsh
        run: python -B scripts/check_release_licenses.py --final

      - name: Test PWA
        shell: pwsh
        working-directory: tools/RLMResearchPlannerPWA
        run: node --test tests/*.test.mjs

      - name: Check PWA release layout
        shell: pwsh
        working-directory: tools/RLMResearchPlannerPWA
        run: node scripts/check-release.mjs
